<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-header">

            <div class="profile-mini">

                <div class="profile-avatar">
                    👤
                </div>

                <div>
                    <h2>ChatApp</h2>
                    <p id="loggedUser"></p>
                </div>

            </div>

            <button id="logoutBtn">
                Logout
            </button>

        </div>



        <!-- SEARCH -->
        <div class="search-box">

            <input
                type="text"
                id="searchUser"
                placeholder="Search users..."
            >
            <button id="profileBtn" class="profile-button">
    👤 My Profile
</button>

<button id="notificationBtn" class="profile-button">
    🔔 Enable Notifications
</button>

        </div>


        <!-- USERS -->
        <div class="users-section">

            <h3>Online Users</h3>

            <div id="usersList"></div>

        </div>

    </div>


    <!-- CHAT AREA -->
    <div class="chat-section">

        <!-- CHAT HEADER -->
        <div class="chat-header">

            <div>

                <h3 id="chatWith">
                    Select a user
                </h3>

                <span id="onlineStatus">
                    Select someone to start chatting
                </span>

            </div>

        </div>


        <!-- MESSAGES -->
        <div class="chat-box" id="chatBox">

            <div class="welcome-message">

                <h2>👋 Welcome to ChatApp</h2>

                <p>
                    Select a user from the left to start a private conversation.
                </p>

            </div>

        </div>


        <!-- TYPING STATUS -->
        <div id="typingStatus"></div>


        <!-- MESSAGE INPUT -->
        <div class="chat-input">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
            >

            <button id="sendBtn">
                ➤
            </button>

        </div>

    </div>

</div>

<div id="profileModal" class="profile-modal">

    <div class="profile-card">

        <button id="closeProfile" class="close-profile">
            ✕
        </button>

        <div class="large-avatar">
            👤
        </div>

        <h2 id="profileUsername">
            Username
        </h2>

        <p id="profileEmail">
            Email
        </p>

        <p class="profile-status">
            🟢 Online
        </p>

    </div>

</div>

<script src="node_modules/socket.io-client/dist/socket.io.min.js"></script>

<script src="script.js"></script>

</body>

</html>
