<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatApp - Login</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                💬
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue to ChatApp
            </p>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>

            <button
                class="auth-btn"
                onclick="login()"
            >
                Login
            </button>

            <p id="message"></p>

            <div class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>

    <script src="auth.js"></script>

</body>

</html>
