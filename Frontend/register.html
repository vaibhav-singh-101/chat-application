<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatApp - Register</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                💬
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join ChatApp and start chatting
            </p>


            <!-- Username -->

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                >

            </div>


            <!-- Email -->

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

            </div>


            <!-- Register Button -->

            <button
                class="auth-btn"
                onclick="register()"
            >
                Create Account
            </button>


            <!-- Message -->

            <p id="message"></p>


            <!-- Login Link -->

            <div class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
